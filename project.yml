name: CasitaCal
options:
  bundleIdPrefix: com.guardiola
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.1.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (gitignored)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.2.0" # bumped by scripts/testflight.sh on each upload
    CURRENT_PROJECT_VERSION: "1"
targets:
  CasitaCal:
    type: application
    platform: iOS
    sources:
      - path: CasitaCal
        excludes:
          - CasitaCal.entitlements
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: CasitaCalShare
    info:
      path: CasitaCal/Info.plist
      properties:
        # Values come from Config/Local.xcconfig (gitignored) — only variable names are committed.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CASITACAL_HAS_WEATHERKIT: $(CASITACAL_HAS_WEATHERKIT)
        CASITACAL_HAS_ICLOUD: $(CASITACAL_HAS_ICLOUD)
        UIBackgroundModes: [remote-notification] # CloudKit change pushes
        CKSharingSupported: true                 # accept household invite links
        ITSAppUsesNonExemptEncryption: false     # only standard HTTPS; skips the export-compliance question
        NSLocationWhenInUseUsageDescription: CasitaCal uses the iPad's location to show local weather on the kitchen display.
        NSRemindersFullAccessUsageDescription: CasitaCal shows and edits your Reminders lists (like a shared Shopping List) on the kitchen display.
        NSRemindersUsageDescription: CasitaCal shows and edits your Reminders lists (like a shared Shopping List) on the kitchen display.
        NSCameraUsageDescription: CasitaCal can use the front camera to wake the kitchen display when someone walks up. Frames are checked on the iPad and never recorded or saved.
        NSPhotoLibraryUsageDescription: CasitaCal shows photos from the album you choose as a slideshow when the kitchen display is idle.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guardiola.casitacal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CasitaCal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  # Safari → Share → CasitaCal (save a recipe link to the plan).
  CasitaCalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: CasitaCalShare
        excludes:
          - CasitaCalShare.entitlements
          - Info.plist
      # Shared with the app: the household database and the recipe reader.
      - CasitaCal/Services/Persistence/Entities.swift
      - CasitaCal/Services/Persistence/Persistence.swift
      - CasitaCal/Services/Recipes/RecipeParser.swift
      - CasitaCal/Services/Recipes/RecipeImporter.swift
      - CasitaCal/Models/AppCalendar.swift
      - CasitaCal/Models/MealSlot.swift
    info:
      path: CasitaCalShare/Info.plist
      properties:
        CFBundleDisplayName: CasitaCal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CASITACAL_HAS_ICLOUD: $(CASITACAL_HAS_ICLOUD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guardiola.casitacal.share
        CODE_SIGN_ENTITLEMENTS: $(CASITACAL_SHARE_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  CasitaCalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CasitaCalTests
    dependencies:
      - target: CasitaCal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guardiola.casitacal.tests
schemes:
  CasitaCal:
    build:
      targets:
        CasitaCal: all
        CasitaCalTests: [test]
    test:
      targets:
        - CasitaCalTests
