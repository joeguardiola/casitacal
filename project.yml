name: CasitaCal
options:
  bundleIdPrefix: com.guardiola
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM comes from Config/Local.xcconfig (gitignored)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CasitaCal:
    type: application
    platform: iOS
    sources:
      - CasitaCal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guardiola.casitacal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CasitaCal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
  CasitaCalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CasitaCalTests
    dependencies:
      - target: CasitaCal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.guardiola.casitacal.tests
schemes:
  CasitaCal:
    build:
      targets:
        CasitaCal: all
        CasitaCalTests: [test]
    test:
      targets:
        - CasitaCalTests
