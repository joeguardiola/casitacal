<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CasitaCal</title>
<style>
  :root { --bg:#FBF7F2; --ink:#2B2622; --muted:#7A7068; --accent:#E87A61; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140F; --ink:#F2ECE4; --muted:#A79D93; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 -apple-system, system-ui, sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:2.4rem; margin:0 0 8px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>🏡 CasitaCal</h1>
  <p>CasitaCal is a private family calendar display for the Guardiola household's kitchen iPad. It shows our shared Google Calendar, chores, lists and meals at a glance.</p>
  <p>It is a personal project and is not offered to the public.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
